networks:
    inception:
        name: inception
        driver: bridge
    backend:
        name: backend
        driver: bridge
secrets:
    mariadb_user_pw:
        file: ../secrets/mariadb_user_pw.txt
    mariadb_root_pw:
        file: ../secrets/mariadb_root_pw.txt
    wp_user_pw:
        file: ../secrets/wp_user_pass.txt
    wp_admin_pw:
        file: ../secrets/wp_bestuser_pass.txt
