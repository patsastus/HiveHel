services:
    wordpress:
        build:
            context: ./requirements/wordpress
            dockerfile: Dockerfile
            args:
                WP_PORT: ${WP_PORT:-9000}
                INSTALL_REDIS: true
        environment:
            MYSQL_DATABASE: ${MYSQL_DATABASE:-wordpress_db}
            MYSQL_USER: ${MYSQL_USER:-wp_user}
            MYSQL_PORT: ${MYSQL_PORT:-3306}
            WP_PORT: ${WP_PORT:-9000}
            WP_DB_HOST: ${WP_DB_HOST:-mariadb}
            WP_DEBUG: ${WP_DEBUG:-true}
            REDIS_PORT: ${REDIS_PORT:-6379}

    redis:
        container_name: redis
        image: redis
        build:
            context: ./requirements/bonus/redis
            dockerfile: Dockerfile
        env_file:
            - .env
        restart: always
        networks:
            - inception

    ftp:
        container_name: ftp
        image: ftp
        build:
            context: ./requirements/bonus/ftp
            dockerfile: Dockerfile
            args:
                RANGE_START: ${FTP_RANGE_START:-21100}
                RANGE_END: ${FTP_RANGE_END:-21110}
        env_file:
            - .env
        environment:
            FTP_USER: ${FTP_USER:-ftpuser}
            FTP_RANGE_START: ${FTP_RANGE_START:-21100}
            FTP_RANGE_END: ${FTP_RANGE_END:-21110}
        restart: always
        secrets:
            - ftp_user_pw
        networks:
            - inception
        volumes:
            - wordpress_data:/var/www/wordpress
        ports:
            - "21:21"
            - "${FTP_RANGE_START}-${FTP_RANGE_END}:${FTP_RANGE_START}-${FTP_RANGE_END}"

secrets:
    ftp_user_pw:
        file: ../secrets/ftp_user_pw.txt
